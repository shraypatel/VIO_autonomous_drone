# RTABMap SLAM parameters for Holybro X500 V2 with OAK-D S2 (real hardware)
# Compatible with CUDA-enabled RTABMap build on Jetson (ARM64, JetPack)
rtabmap:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_odom: true
    approx_sync: true
    queue_size: 10
    # SLAM parameters
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    RGBD/ProximityBySpace: "true"
    RGBD/AngularUpdate: "0.01"
    RGBD/LinearUpdate: "0.01"
    RGBD/OptimizeFromGraphEnd: "false"
    Reg/Strategy: "0"
    Reg/Force3DoF: "false"
    Grid/CellSize: "0.05"
    Grid/RangeMax: "5.0"
    Grid/RangeMin: "0.3"
    Grid/3D: "true"
    Grid/MaxGroundAngle: "45"
    Grid/MaxObstacleHeight: "2.0"
    Grid/NormalK: "20"
    Vis/MinInliers: "15"
    Vis/InlierDistance: "0.1"
    # Point cloud output for ESDF server
    cloud_output_voxelized: true
    cloud_voxel_size: 0.05
